services:
  - type: web
    name: aux-prac-4-juan-chambi
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/books
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: aux-prac-4-juan-chambi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aux-prac-4-juan-chambi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aux-prac-4-juan-chambi-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aux-prac-4-juan-chambi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aux-prac-4-juan-chambi-db
          property: password
databases:
  - name: aux-prac-4-juan-chambi-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
    ipAllowList: []
